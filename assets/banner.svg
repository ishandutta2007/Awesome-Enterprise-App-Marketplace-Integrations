<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        fill: #f8fafc;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #38bdf8;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #64748b;
      }

      /* Dynamic Animations (Kept in background / ambient layers) */
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-18px) scale(1.05); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(20px) scale(0.96); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.15); }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbitRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .ambient-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite, floatSlow1 12s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .ambient-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite alternate, floatSlow2 15s ease-in-out infinite;
        transform-origin: 1000px 300px;
      }
      .ambient-orb-3 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 600px 200px;
      }
      .animated-wire {
        stroke-dasharray: 12, 8;
        animation: circuitFlow 18s linear infinite;
      }
      .floating-node-1 {
        animation: floatSlow1 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatSlow2 7s ease-in-out infinite;
      }
      .rotating-ring {
        animation: orbitRotate 40s linear infinite;
        transform-origin: 1050px 130px;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Background Animated Glowing Orbs (Completely behind text) -->
  <g opacity="0.45">
    <circle class="ambient-orb-1" cx="180" cy="120" r="140" fill="#0284c7" filter="url(#glow-cyan)" />
    <circle class="ambient-orb-2" cx="1020" cy="280" r="160" fill="#7c3aed" filter="url(#glow-purple)" />
    <circle class="ambient-orb-3" cx="620" cy="220" r="90" fill="#0ea5e9" opacity="0.25" filter="url(#glow-cyan)" />
  </g>

  <!-- Background Decorative Integration Circuit Lines & Nodes -->
  <g opacity="0.35">
    <path class="animated-wire" d="M 0,210 L 280,210 L 360,340 L 840,340 L 920,210 L 1200,210" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="animated-wire" d="M 150,0 L 150,150 L 250,250 L 950,250 L 1050,350 L 1050,420" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="280" cy="210" r="4" fill="#38bdf8" />
    <circle cx="360" cy="340" r="4" fill="#818cf8" />
    <circle cx="840" cy="340" r="4" fill="#c084fc" />
    <circle cx="920" cy="210" r="4" fill="#38bdf8" />
  </g>

  <!-- Subtle Futuristic Orbit / Radar in Top-Right Background -->
  <g opacity="0.25" class="rotating-ring">
    <circle cx="1050" cy="130" r="80" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="10 20" />
    <circle cx="1050" cy="130" r="50" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="6 12" />
    <circle cx="1050" cy="50" r="5" fill="#38bdf8" />
  </g>

  <!-- Floating Micro-Cards (Flanking sides, never obstructing center text) -->
  <g class="floating-node-1" transform="translate(60, 260)" opacity="0.85">
    <rect width="170" height="64" rx="10" fill="url(#card-grad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <text x="18" y="28" class="card-title">🔌 Embedded iPaaS</text>
    <text x="18" y="48" class="card-sub">Catalogs &amp; Unified APIs</text>
  </g>
  <g class="floating-node-2" transform="translate(970, 260)" opacity="0.85">
    <rect width="170" height="64" rx="10" fill="url(#card-grad)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.2" />
    <text x="18" y="28" class="card-title" fill="#c084fc">🤖 AI &amp; MCP Agents</text>
    <text x="18" y="48" class="card-sub">Ecosystem Orchestration</text>
  </g>

  <!-- Foreground Title and Content (Solid, Clear & High-Contrast) -->
  <g id="foreground-content">
    <!-- Top Pill / Category -->
    <g transform="translate(430, 48)">
      <rect width="340" height="34" rx="17" fill="url(#pill-grad)" opacity="0.2" />
      <rect width="340" height="34" rx="17" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
      <text x="170" y="22" text-anchor="middle" class="pill-text" fill="#38bdf8">⚡ CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="44" fill="url(#cyan-indigo)">
      Awesome Enterprise App Marketplaces
    </text>
    <text x="600" y="195" text-anchor="middle" class="title-text" font-size="34">
      &amp; Integration Platforms
    </text>

    <!-- Subtitle & Value Prop -->
    <text x="600" y="245" text-anchor="middle" class="subtitle-text" font-size="18">
      Top SaaS Marketplaces, Embedded Integration Catalogs &amp; Open-Source iPaaS Frameworks
    </text>

    <!-- Interactive / Feature Badges Row -->
    <g transform="translate(240, 290)">
      <!-- Badge 1: SaaS Leaders -->
      <g transform="translate(0, 0)">
        <rect width="210" height="38" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(148, 163, 184, 0.25)" stroke-width="1" />
        <text x="105" y="24" text-anchor="middle" class="pill-text">🏢 SaaS &amp; Hyperscalers</text>
      </g>
      <!-- Badge 2: Open Source -->
      <g transform="translate(240, 0)">
        <rect width="230" height="38" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
        <text x="115" y="24" text-anchor="middle" class="pill-text" fill="#38bdf8">⭐ 100% Open Source</text>
      </g>
      <!-- Badge 3: Connectors & AI -->
      <g transform="translate(500, 0)">
        <rect width="220" height="38" rx="8" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1" />
        <text x="110" y="24" text-anchor="middle" class="pill-text" fill="#c084fc">🧩 Pre-built Connectors</text>
      </g>
    </g>

    <!-- Bottom Metric / Tagline -->
    <text x="600" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" fill="#64748b" letter-spacing="1">
      AVOID VENDOR LOCK-IN • FEDERATED DIRECTORIES • PRODUCTION-GRADE PATTERNS
    </text>
  </g>
</svg>
