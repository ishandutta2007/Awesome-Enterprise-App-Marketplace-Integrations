<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="cyan-indigo" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.5)"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#6366f1"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-purple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="40"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow1{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-18px) scale(1.05)}}@keyframes floatSlow2{0%{transform:translateY(0) scale(1)}50%{transform:translateY(20px) scale(.96)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.15)}}@keyframes circuitFlow{0%{stroke-dashoffset:400}}.card-sub,.card-title,.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;fill:#f8fafc;letter-spacing:-1px}.subtitle-text{font-weight:500;fill:#94a3b8}.pill-text{font-weight:600;font-size:13px;fill:#e2e8f0}.card-title{font-weight:700;font-size:14px;fill:#38bdf8}.card-sub{font-weight:400;font-size:11px;fill:#64748b}.ambient-orb-1{animation:pulseGlow 8s ease-in-out infinite,floatSlow1 12s ease-in-out infinite;transform-origin:200px 100px}.ambient-orb-2{animation:pulseGlow 10s ease-in-out infinite alternate,floatSlow2 15s ease-in-out infinite;transform-origin:1000px 300px}.ambient-orb-3{animation:pulseGlow 7s ease-in-out infinite;transform-origin:600px 200px}.animated-wire{stroke-dasharray:12,8;animation:circuitFlow 18s linear infinite}.floating-node-1{animation:floatSlow1 6s ease-in-out infinite}.floating-node-2{animation:floatSlow2 7s ease-in-out infinite}.rotating-ring{animation:orbitRotate 40s linear infinite;transform-origin:1050px 130px}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".45"><circle cx="180" cy="120" r="140" fill="#0284c7" class="ambient-orb-1" filter="url(#glow-cyan)"/><circle cx="1020" cy="280" r="160" fill="#7c3aed" class="ambient-orb-2" filter="url(#glow-purple)"/><circle cx="620" cy="220" r="90" fill="#0ea5e9" class="ambient-orb-3" filter="url(#glow-cyan)" opacity=".25"/></g><g opacity=".35"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 0,210 L 280,210 L 360,340 L 840,340 L 920,210 L 1200,210" class="animated-wire"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 150,0 L 150,150 L 250,250 L 950,250 L 1050,350 L 1050,420" class="animated-wire"/><circle cx="280" cy="210" r="4" fill="#38bdf8"/><circle cx="360" cy="340" r="4" fill="#818cf8"/><circle cx="840" cy="340" r="4" fill="#c084fc"/><circle cx="920" cy="210" r="4" fill="#38bdf8"/></g><g class="rotating-ring" opacity=".25"><circle cx="1050" cy="130" r="80" fill="none" stroke="#38bdf8" stroke-dasharray="10 20" stroke-width="1.5"/><circle cx="1050" cy="130" r="50" fill="n